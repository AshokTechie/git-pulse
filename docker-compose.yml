services:
  postgres:
    image: postgres:16-alpine
    container_name: gitpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitpulse
      POSTGRES_PASSWORD: gitpulse
      POSTGRES_DB: gitpulse
    ports:
      - "5432:5432"
    volumes:
      - gitpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpulse -d gitpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gitpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gitpulse_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gitpulse_pgdata:
  gitpulse_redisdata: